name: Integrated Vector Engine CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install C compiler and SQLite libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev clang

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run automated stack integration tests
        run: |
          chmod +x test_app.sh
          ./test_app.sh

      - name: Validate Docker image build
        run: docker build -t vector-engine:ci .
